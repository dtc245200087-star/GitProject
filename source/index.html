<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Tạo giao diện form đăng ký người dùng</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }
            .form-container {
                width: 350px;
                border: 1px solid #ccc;
                padding: 20px;
                border-radius: 5px;
            }
            .form-group {
                margin-bottom: 15px;
            }
            .form-group label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
            }
            .form-group input[type="text"],
            .form-group input[type="email"] {
                width: 100%;
                padding: 8px;
                box-sizing: border-box;
            }
            .btn-submit {
                background-color: #4CAF50;
                color: white;
                padding: 8px 15px;
                border: none;
                border-radius: 3px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>

        <h2>Form Đăng Ký Người Dùng</h2>

        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST" class="form-container">
            <div class="form-group">
                <label>Họ và tên:</label>
                <input type="text" name="name" placeholder="Nhập họ và tên" required>
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" placeholder="Nhập email" required>
            </div>

            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="text" name="phone" placeholder="Nhập số điện thoại" required>
            </div>

            <div class="form-group">
                <label>Giới tính:</label>
                <input type="radio" name="gender" value="Nam" checked> Nam
                <input type="radio" name="gender" value="Nữ"> Nữ
            </div>

            <button type="submit" class="btn-submit">Đăng ký</button>
        </form>

    </body>
</html>
