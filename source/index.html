<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập CSS Flexbox Responsive Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Header</h1>
        </header>

        <!-- Navigation -->
        <nav class="nav">
            <a href="#">Trang chủ</a>
            <a href="#">Giới thiệu</a>
            <a href="#">Dịch vụ</a>
            <a href="#">Liên hệ</a>
        </nav>

        <!-- Main Container chứa Nội dung chính & Sidebar -->
        <div class="main-container">
            <main class="content">
                <h2>Main Content</h2>
                <p>Nội dung chính của trang web hiển thị ở đây.</p>
            </main>
            <aside class="sidebar">
                <h3>Sidebar</h3>
                <p>Nội dung phụ (Tin tức, quảng cáo...)</p>
            </aside>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Footer - Copyright &copy; 2026</p>
        </footer>
    </div>

</body>
</html>
