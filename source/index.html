<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Market Research Survey</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            margin: 20px;
            font-size: 14px;
            color: #333;
        }

        .survey-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 10px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 20px;
            color: #222;
        }

        .subtitle {
            font-size: 13px;
            color: #555;
            border-bottom: 1px dotted #ccc;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group > label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            max-width: 400px;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 2px;
        }

        textarea {
            width: 100%;
            height: 80px;
            border: 1px solid #ccc;
            padding: 5px;
        }

        .radio-group, .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .radio-group label, .checkbox-group label {
            font-weight: normal;
            cursor: pointer;
        }

        .text-input-other {
            width: 100px;
            padding: 3px;
            border: 1px solid #ccc;
            margin-left: 18px;
            margin-top: 2px;
        }

        /* Thẻ vàng nổi bật cho ô nhập giá tiền */
        .highlight-box {
            background-color: #fff9d7;
            padding: 12px;
            border-radius: 3px;
        }

        .price-container {
            display: flex;
            align-items: flex-start;
            gap: 4px;
        }

        .price-symbol {
            font-size: 14px;
            margin-top: 4px;
        }

        .price-field {
            display: flex;
            flex-direction: column;
        }

        .price-field input {
            width: 55px;
            padding: 4px;
            border: 1px solid #888;
        }

        .price-label {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
        }

        /* Bảng thang đo Likert */
        .likert-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        .likert-table th, .likert-table td {
            padding: 8px 5px;
            text-align: center;
        }

        .likert-table th {
            font-size: 12px;
            font-weight: bold;
            vertical-align: bottom;
        }

        .likert-table td.statement {
            text-align: left;
            font-weight: normal;
            width: 50%;
        }

        .likert-table tbody tr:nth-child(odd) {
            background-color: #f2f2f2;
        }

        .likert-table tbody tr:nth-child(even) {
            background-color: #ffffff;
        }

        .submit-btn {
            margin-top: 15px;
            padding: 6px 16px;
            background-color: #444;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 2px;
        }

        .submit-btn:hover {
            background-color: #222;
        }
    </style>
</head>
<body>

    <div class="survey-container">
        <h2>Market Research Survey</h2>
        <p class="subtitle">Please take a few moments to complete this satisfaction survey.</p>

        <form>
            <!-- 1. Age Range -->
            <div class="form-group">
                <label for="age">What is your age range?</label>
                <select id="age" name="age">
                    <option value="18-24">18-24</option>
                    <option value="25-34">25-34</option>
                    <option value="35-50">35-50</option>
                    <option value="50+">50+</option>
                </select>
            </div>

            <!-- 2. Income Range -->
            <div class="form-group">
                <label for="income">What is your yearly income range?</label>
                <select id="income" name="income">
                    <option value="0-25000">$0 - $25,000</option>
                    <option value="25001-50000">$25,001 - $50,000</option>
                    <option value="50001-100000">$50,001 - $100,000</option>
                    <option value="100000+">$100,000+</option>
                </select>
            </div>

            <!-- 3. Gender Identity -->
            <div class="form-group">
                <label>Gender Identity</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="Male"> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                    <label><input type="radio" name="gender" value="Nonbinary"> Nonbinary</label>
                    <label><input type="radio" name="gender" value="Other"> Other</label>
                    <div>
                        <input type="text" name="gender_other" class="text-input-other">
                    </div>
                </div>
            </div>

            <!-- 4. Products Purchased -->
            <div class="form-group">
                <label>Which of the following products have your purchased in the last 2 months. Please check all that apply.</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="product" value="Product 1"> Product 1</label>
                    <label><input type="checkbox" name="product" value="Product 2"> Product 2</label>
                    <label><input type="checkbox" name="product" value="Product 3"> Product 3</label>
                </div>
            </div>

            <!-- 5. Frequency -->
            <div class="form-group">
                <label>How often would you use our new product?</label>
                <div class="radio-group">
                    <label><input type="radio" name="frequency" value="Daily"> Daily</label>
                    <label><input type="radio" name="frequency" value="Weekly"> Weekly</label>
                    <label><input type="radio" name="frequency" value="Monthly"> Monthly</label>
                </div>
            </div>

            <!-- 6. What would you pay -->
            <div class="form-group highlight-box">
                <label>What would you pay for the new product?</label>
                <div class="price-container">
                    <span class="price-symbol">$</span>
                    <div class="price-field">
                        <input type="text" name="dollars">
                        <span class="price-label">Dollars</span>
                    </div>
                    <span class="price-symbol">.</span>
                    <div class="price-field">
                        <input type="text" name="cents" maxlength="2">
                        <span class="price-label">Cents</span>
                    </div>
                </div>
            </div>

            <!-- 7. Features -->
            <div class="form-group">
                <label for="features">What features would you like to see in the new product.</label>
                <textarea id="features" name="features"></textarea>
            </div>

            <!-- 8. Agreement Scale -->
            <div class="form-group">
                <label>Please rate your level of agreement with the following statements.</label>
                <table class="likert-table">
                    <thead>
                        <tr>
                            <th></th>
                            <th>Strongly Disagree<br>1</th>
                            <th>Disagree<br>2</th>
                            <th>Agree<br>3</th>
                            <th>Strongly Agree<br>4</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="statement">Our products are priced fairly.</td>
                            <td><input type="radio" name="priced_fairly" value="1"></td>
                            <td><input type="radio" name="priced_fairly" value="2"></td>
                            <td><input type="radio" name="priced_fairly" value="3"></td>
                            <td><input type="radio" name="priced_fairly" value="4"></td>
                        </tr>
                        <tr>
                            <td class="statement">Our products are high quality.</td>
                            <td><input type="radio" name="quality" value="1"></td>
                            <td><input type="radio" name="quality" value="2"></td>
                            <td><input type="radio" name="quality" value="3"></td>
                            <td><input type="radio" name="quality" value="4"></td>
                        </tr>
                        <tr>
                            <td class="statement">You would recommend our product to a friend or coworker.</td>
                            <td><input type="radio" name="recommend" value="1"></td>
                            <td><input type="radio" name="recommend" value="2"></td>
                            <td><input type="radio" name="recommend" value="3"></td>
                            <td><input type="radio" name="recommend" value="4"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

</body>
</html>
