<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Tài Khoản</title>
    <!-- Nhúng Bootstrap 5 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Thẻ chứa Form đăng ký -->
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-sm-5">
                        <!-- Tiêu đề Form -->
                        <h2 class="text-center fw-bold mb-2">Đăng Ký Tài Khoản</h2>
                        <p class="text-center text-muted mb-4">Vui lòng điền đầy đủ thông tin bên dưới</p>

                        <form>
                            <!-- 1. Họ và tên -->
                            <div class="mb-3">
                                <label for="fullname" class="form-label fw-semibold">Họ và tên</label>
                                <input type="text" class="form-control" id="fullname" placeholder="Nhập họ và tên của bạn" required>
                            </div>

                            <!-- 2. Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                                <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
                                <div class="form-text text-muted">Chúng tôi cam kết không chia sẻ email của bạn cho bên thứ ba.</div>
                            </div>

                            <!-- 3. Mật khẩu -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" placeholder="Tối thiểu 8 ký tự" required>
                            </div>

                            <!-- 4. Xác nhận mật khẩu -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                            </div>

                            <!-- 5. Giới tính (Radio button) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Giới tính</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                    <label class="form-check-label" for="genderMale">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                    <label class="form-check-label" for="genderFemale">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                    <label class="form-check-label" for="genderOther">Khác</label>
                                </div>
                            </div>

                            <!-- 6. Sở thích (Checkbox) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Sở thích</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding">
                                    <label class="form-check-label" for="hobbyCoding">Lập trình</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                                    <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
                                    <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                    <label class="form-check-label" for="hobbySports">Thể thao</label>
                                </div>
                            </div>

                            <!-- 7. Quốc gia (Dropdown Select) -->
                            <div class="mb-4">
                                <label for="country" class="form-label fw-semibold">Quốc gia</label>
                                <select class="form-select" id="country" required>
                                    <option value="" selected disabled>-- Chọn quốc gia --</option>
                                    <option value="VN">Việt Nam</option>
                                    <option value="US">Mỹ</option>
                                    <option value="JP">Nhật Bản</option>
                                    <option value="KR">Hàn Quốc</option>
                                    <option value="SG">Singapore</option>
                                </select>
                            </div>

                            <!-- 8. Nút Submit -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Đăng Ký Ngay</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
