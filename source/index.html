<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành grid-template-columns</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Thực hành Thuộc tính grid-template-columns</h2>

    <!-- Ví dụ 1: Chia cột theo kích thước cố định (px) và auto -->
    <h3>Ví dụ 1: Cột cố định và auto</h3>
    <div class="grid-container grid-example-1">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
        <div class="grid-item">4</div>
    </div>

    <!-- Ví dụ 2: Chia cột theo đơn vị fr (fraction) -->
    <h3>Ví dụ 2: Cột theo tỉ lệ (fr)</h3>
    <div class="grid-container grid-example-2">
        <div class="grid-item">Cột 1 (1fr)</div>
        <div class="grid-item">Cột 2 (2fr)</div>
        <div class="grid-item">Cột 3 (1fr)</div>
    </div>

</body>
</html>
