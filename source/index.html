<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Bảng trong CSS</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }

            /* Định kiểu cho bảng */
            table {
                width: 100%;
                border-collapse: collapse; /* Gộp đường viền thành một đường duy nhất */
            }

            /* Định kiểu cho thẻ tiêu đề th và ô td */
            th, td {
                border: 1px solid #ddd;
                padding: 12px;
                text-align: left; /* Căn chỉnh nội dung theo chiều ngang */
                vertical-align: middle; /* Căn chỉnh nội dung theo chiều dọc */
            }

            /* Định kiểu riêng cho hàng tiêu đề (th) */
            th {
                height: 50px;
                background-color: #04AA6D;
                color: white;
            }

            /* Hiệu ứng đổi màu khi di chuột qua hàng (hover) */
            tr:hover {
                background-color: #f5f5f5;
            }

            /* Tô màu xen kẽ cho các hàng (Zebra striping) */
            tr:nth-child(even) {
                background-color: #f2f2f2;
            }
        </style>
    </head>
    <body>

        <h2>Thực hành định kiểu Bảng (Table) trong CSS</h2>

        <table>
            <tr>
                <th>Họ và Tên</th>
                <th>Khóa học</th>
                <th>Thành phố</th>
            </tr>
            <tr>
                <td>Nguyễn Văn A</td>
                <td>Web Frontend</td>
                <td>Hà Nội</td>
            </tr>
            <tr>
                <td>Trần Thị B</td>
                <td>Java Fullstack</td>
                <td>Đà Nẵng</td>
            </tr>
            <tr>
                <td>Lê Văn C</td>
                <td>Python Development</td>
                <td>TP. Hồ Chí Minh</td>
            </tr>
            <tr>
                <td>Phạm Thị D</td>
                <td>Data Science</td>
                <td>Cần Thơ</td>
            </tr>
        </table>

    </body>
</html>
