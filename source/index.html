<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành flex-wrap Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Thực hành Thuộc tính flex-wrap</h2>

    <!-- Ví dụ flex-wrap: wrap -->
    <h3>1. flex-wrap: wrap</h3>
    <div class="flex-container flex-wrap">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
        <div class="flex-item">Item 4</div>
        <div class="flex-item">Item 5</div>
        <div class="flex-item">Item 6</div>
    </div>

    <!-- Ví dụ flex-wrap: nowrap -->
    <h3>2. flex-wrap: nowrap (Mặc định)</h3>
    <div class="flex-container flex-nowrap">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
        <div class="flex-item">Item 4</div>
        <div class="flex-item">Item 5</div>
        <div class="flex-item">Item 6</div>
    </div>

</body>
</html>
