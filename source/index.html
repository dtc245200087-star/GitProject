<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Tạo Form Đơn Giản</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }
            .form-container {
                border: 1px solid #ccc;
                padding: 20px;
                margin-bottom: 30px;
                max-width: 500px;
                background-color: #f9f9f9;
            }
            .form-title {
                background-color: #e67e22;
                color: white;
                padding: 10px;
                margin-top: 0;
            }
            .form-group {
                margin-bottom: 15px;
            }
            .form-group label {
                display: inline-block;
                width: 120px;
            }
        </style>
    </head>
    <body>

        <!-- PHẦN 1: FORM SỞ THÍCH -->
        <div class="form-container">
            <h2 class="form-title">SỞ THÍCH CỦA BẠN</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label>Họ và tên:</label>
                    <input type="text" name="yourname" placeholder="Nhập họ tên">
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" name="email" placeholder="Nhập email">
                </div>
                <div class="form-group">
                    <label>Sở thích:</label><br>
                    <input type="checkbox" name="hobby" value="sports"> Thể thao
                    <input type="checkbox" name="hobby" value="music"> Âm nhạc
                    <input type="checkbox" name="hobby" value="reading"> Đọc sách<br>
                    <input type="checkbox" name="hobby" value="travel"> Du lịch
                    <input type="checkbox" name="hobby" value="game"> Chơi game
                    <input type="checkbox" name="hobby" value="code"> Lập trình
                </div>
                <div>
                    <input type="submit" value="Gửi thông tin">
                    <input type="reset" value="Nhập lại">
                </div>
            </form>
        </div>

        <!-- PHẦN 2: FORM ĐĂNG KÝ HỌC VIÊN -->
        <div class="form-container">
            <h2 class="form-title" style="background-color: #2980b9;">ĐĂNG KÝ HỌC VIÊN</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label>Họ và tên:</label>
                    <input type="text" name="fullname">
                </div>
                <div class="form-group">
                    <label>Ngày sinh:</label>
                    <input type="date" name="dob">
                </div>
                <div class="form-group">
                    <label>Giới tính:</label>
                    <input type="radio" name="gender" value="male"> Nam
                    <input type="radio" name="gender" value="female"> Nữ
                </div>
                <div class="form-group">
                    <label>Địa chỉ:</label>
                    <textarea name="address" rows="3" cols="30"></textarea>
                </div>
                <div class="form-group">
                    <label>Lớp học:</label>
                    <select name="course">
                        <option value="html">HTML & CSS</option>
                        <option value="js">Javascript</option>
                        <option value="php">PHP & MySQL</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" name="user_email">
                </div>
                <div class="form-group">
                    <label>Điện thoại:</label>
                    <input type="text" name="phone">
                </div>
                <div>
                    <input type="submit" value="Đăng ký">
                    <input type="reset" value="Nhập lại">
                </div>
            </form>
        </div>

    </body>
</html>
