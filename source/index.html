<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Danh Sách Sản Phẩm</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }
            table {
                width: 100%;
                max-width: 600px;
                border-collapse: collapse;
                margin-top: 15px;
            }
            th, td {
                border: 1px solid #dddddd;
                text-align: left;
                padding: 10px;
            }
            th {
                background-color: #f2f2f2;
            }
            tr:nth-child(even) {
                background-color: #f9f9f9;
            }
        </style>
    </head>
    <body>

        <h1>Danh sách sản phẩm</h1>

        <table>
            <thead>
                <tr>
                    <th>Tên sản phẩm</th>
                    <th>Giá</th>
                    <th>Số lượng</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Điện thoại iPhone 15 Pro</td>
                    <td>28.990.000 VNĐ</td>
                    <td>15</td>
                </tr>
                <tr>
                    <td>Laptop MacBook Air M2</td>
                    <td>24.500.000 VNĐ</td>
                    <td>8</td>
                </tr>
                <tr>
                    <td>Tai nghe AirPods Pro 2</td>
                    <td>5.690.000 VNĐ</td>
                    <td>25</td>
                </tr>
                <tr>
                    <td>Đồng hồ Apple Watch Series 9</td>
                    <td>10.290.000 VNĐ</td>
                    <td>12</td>
                </tr>
            </tbody>
        </table>

    </body>
</html>
