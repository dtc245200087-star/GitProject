<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Bố Cục 3 Cột bằng Bootstrap Grid và Flexbox</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Bước 2: Áp dụng Margin & Padding để điều chỉnh khoảng cách -->
    <div class="container my-5 py-3">
        <h3 class="text-center">Khoảng cách được điều chỉnh bằng Margin & Padding</h3>
    </div>

    <!-- Bước 1: Cấu trúc Grid với 3 cột -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3">
                <p class="m-0">Phần 1</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-3 text-white">
                <p class="m-0">Phần 2</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3">
                <p class="m-0">Phần 3</p>
            </div>
        </div>
    </div>

    <!-- Bước 3: Sử dụng Display Property để hiển thị ẩn hiện nội dung -->
    <div class="container mt-4">
        <div class="d-none d-md-block bg-warning text-center p-3">
            <p class="m-0 fw-bold">Nội dung này chỉ hiển thị trên màn hình lớn hơn 768px</p>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
