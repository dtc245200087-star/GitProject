<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng Box Model 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>So sánh content-box và border-box</h2>

    <div class="card">
        <h3>Thẻ 1 (content-box)</h3>
        <p>Kích thước tổng bị phình to hơn (Width thực tế = 330px).</p>
    </div>

    <div class="card">
        <h3>Thẻ 2 (border-box)</h3>
        <p>Kích thước tổng giữ nguyên chuẩn 280px.</p>
    </div>

    <div class="card">
        <h3>Thẻ 3 (border-box)</h3>
        <p>Kích thước tổng giữ nguyên chuẩn 280px.</p>
    </div>

</body>
</html>
