<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhúng CSS vào trang HTML</title>
    
    <!-- Phần 3: External CSS (Kết nối file style.css) -->
    <link rel="stylesheet" href="style.css">

    <!-- Phần 2: Internal CSS -->
    <style>
        .internal-title {
            color: green;
        }
        .internal-text {
            color: purple;
        }
    </style>
</head>
<body>

    <!-- Phần 1: Inline CSS -->
    <h1 style="color: red;">Tiêu đề sử dụng Inline CSS (Màu đỏ)</h1>
    <p style="color: blue;">Đoạn văn sử dụng Inline CSS (Màu xanh dương).</p>

    <hr>

    <!-- Phần 2: Internal CSS -->
    <h1 class="internal-title">Tiêu đề sử dụng Internal CSS (Màu xanh lá)</h1>
    <p class="internal-text">Đoạn văn sử dụng Internal CSS (Màu tím).</p>

    <hr>

    <!-- Phần 3: External CSS -->
    <h1 class="external-title">Tiêu đề sử dụng External CSS (Màu cam)</h1>
    <p class="external-text">Đoạn văn sử dụng External CSS (Màu xám/Teal).</p>

</body>
</html>
