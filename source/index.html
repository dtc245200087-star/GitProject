<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sử dụng bộ chọn CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Element selector -->
    <h1>Trang web của tôi</h1>

    <!-- ID selector -->
    <p id="about-me">Tôi là một học viên Frontend đang học định dạng giao diện bằng các bộ chọn CSS.</p>

    <!-- Class & Grouping selectors -->
    <h2>Sở thích của tôi</h2>
    <ul class="hobby-list">
        <li class="hobby-item item-1">Lập trình web</li>
        <li class="hobby-item item-2">Đọc sách công nghệ</li>
        <li class="hobby-item item-3">Nghe nhạc thư giãn</li>
    </ul>

    <!-- Pseudo-class selector (:hover) -->
    <button class="btn-click">Nhấn vào đây</button>

</body>
</html>
